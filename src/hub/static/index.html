<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Hub</title>
  <link rel="stylesheet" href="/static/app.css?v=20"/>
</head>
<body>
  <div id="readOnlyBanner" class="readonly-banner" hidden>Public demo · read-only</div>
  <button type="button" class="menu-btn" id="menuBtn" aria-label="Open folders">☰</button>
  <div class="lang-toggle lang-toggle-bar" id="langToggleBar" role="group" aria-label="Language">
    <button type="button" data-lang="en" class="active">EN</button>
    <button type="button" data-lang="pt">PT</button>
  </div>
  <div class="scrim" id="menuScrim"></div>
  <aside class="rail" id="rail">
    <div class="brand">
      <span class="mark">H</span>
      <div>
        <strong>Hub</strong>
        <small id="brandTag">living archive</small>
      </div>
    </div>
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Language">
      <button type="button" data-lang="en" class="active">EN</button>
      <button type="button" data-lang="pt">PT</button>
    </div>
    <nav class="views" id="views"></nav>
    <nav id="folders" class="folders"></nav>
    <nav id="subfolders" class="chips"></nav>
    <div class="rail-foot">
      <form class="logout-form" method="post" action="/auth/logout" id="logoutForm" hidden>
        <button type="submit" id="btnLogout">Log out</button>
      </form>
    </div>
  </aside>
  <main>
    <header class="top">
      <label class="search" id="searchWrap">
        <span id="searchLabel">Search</span>
        <input id="q" type="search" placeholder="invoice, workout, instagram, ID, suno…" autocomplete="off"/>
      </label>
      <h1 class="page-title" id="pageTitle" hidden></h1>
      <div class="filters" id="statusFilters"></div>
    </header>
    <div class="capturebar" id="captureBar" hidden>
      <button type="button" id="btnUpload">Upload</button>
      <input id="fileInput" type="file" multiple hidden/>
      <span class="capturebar-status" id="uploadStatus"></span>
    </div>
    <section id="workspace" class="grid"></section>
  </main>
  <aside id="drawer" class="drawer hidden" hidden></aside>
  <script src="/static/app.js?v=22"></script>
</body>
</html>
